<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="black">
      <caption>
        A test table with merged cells
      </caption>
      <thead>
        <tr>
          <th rowspan="2"></th>
          <th colspan="2">Price</th>
          <th rowspan="2">Quanitity</th>
        </tr>
        <tr>
          <th>INR</th>
          <th>USD</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Frooti</td>
          <td>10</td>
          <td>0.14</td>
          <td>2</td>
        </tr>
        <tr>
          <td>Samosa</td>
          <td>12</td>
          <td>0.18</td>
          <td>3</td>
        </tr>
        <tr>
          <td>Chips</td>
          <td>20</td>
          <td>0.28</td>
          <td>4</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
