          name="user"
        />
      </div>
      <div>
        <label for="password">password : </label>
        <input
          type="password"
          placeholder="Enter password"
          id="password"
          name="pass"
        />
      </div>
      <button>Submit</button>
    </form>

      <input type="text" placeholder="Search" name="search_query" />
      <button>Search</button>
    </form>
